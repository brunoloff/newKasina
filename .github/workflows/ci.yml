name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_dir: target/release
          - os: windows-latest
            binary_dir: target/x86_64-pc-windows-msvc/release
            rust_target: x86_64-pc-windows-msvc
          - os: macos-15
            binary_dir: target/release
          - os: macos-15-intel
            binary_dir: target/release
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Use the self-contained Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_BUILD_TARGET=${{ matrix.rust_target }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libdbus-1-dev libudev-dev libwayland-dev
          libgtk-3-dev libayatana-appindicator3-dev
          libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev
          xvfb mesa-vulkan-drivers
      - name: Validate packaging resources
        run: python scripts/package-desktop.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --workspace --release
      - name: Package desktop application
        run: python scripts/package-desktop.py --binary-dir "${{ matrix.binary_dir }}"
      - name: Smoke-test packaged desktop application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/package-desktop.py --smoke-test
      - name: Smoke-test packaged desktop application (Windows and macOS)
        if: runner.os != 'Linux'
        run: python scripts/package-desktop.py --smoke-test
      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ runner.os }}-${{ runner.arch }}
          path: dist/smoke-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: newKasina-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
