[workspace]
resolver = "3"
members = [
    "crates/kasina-domain",
    "crates/kasina-analysis",
    "crates/kasina-protocol",
    "crates/kasina-devices",
    "crates/kasina-polar",
    "crates/kasina-godirect",
    "crates/kasina-service",
    "crates/kasina-render",
    "crates/kasina-audio",
    "crates/kasina-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["newKasina contributors"]
repository = "https://github.com/example/newKasina"

[workspace.dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
btleplug = "0.12.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.5.60", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wayland", "wgpu", "x11"] }
egui = "0.36.1"
egui-wgpu = "0.36.1"
fs2 = "0.4.3"
futures = "0.3.32"
parking_lot = "0.12.5"
prost = "0.14.3"
protoc-bin-vendored = "3.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.profiling]
inherits = "release"
debug = true

